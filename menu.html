  <div id="orderModal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">Оформление заказа</h2>
        <p id="modalProductName"></p>
        <div class="form-group">
            <input type="text" id="custName" placeholder="Ваше имя" required>
        </div>
        <div class="form-group">
            <input type="tel" id="custPhone" placeholder="+996 (___) ___-___" required>
        </div>
        <button id="confirmOrderBtn" class="confirm-btn">Подтвердить заказ</button>
    </div>
</div>

<div id="successModal" class="modal">
    <div class="modal-content success-card">
        <div class="success-icon">✔</div>
        <h2>Заказ принят!</h2>
        <p id="successMessage"></p>
        <button onclick="closeSuccessModal()" class="confirm-btn">Отлично</button>
